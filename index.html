<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Under the Tree</title>
<meta name="apple-mobile-web-app-title" content="Under the Tree">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- On an iPhone or iPad, Safari shows a strip at the top: open this in the app, or get the app. An invite link hands the app its code. -->
<script>(function(){var c=(location.hash.split('/join/')[1]||'').replace(/[^A-Za-z0-9-]/g,'').slice(0,12);document.write('<meta name="apple-itunes-app" content="app-id=6836867384'+(c?', app-argument=underthetree://join/'+c:'')+'">');})();</script>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=67">
</head>
<body>

<div id="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="photo" id="bgPhoto"></div>
  <div class="shade"></div>
</div>
<canvas id="back" aria-hidden="true"></canvas>
<div id="scrim"></div>
<div id="santa" aria-hidden="true"></div>

<div id="shell">
  <header id="top">
    <a class="wordmark" href="#/" id="wordmark"></a>
    <button id="meBtn" class="me-btn" aria-label="Switch person"></button>
  </header>
  <main id="page"></main>
  <div id="player">
    <button class="p-open" id="pOpen" aria-label="Choose a song">
      <span class="p-art" id="pArt"></span>
      <span class="p-meta"><span class="p-title" id="pTitle">Christmas music</span><span class="p-sub" id="pSub">Tap to pick a song</span></span>
    </button>
    <button class="p-btn main" id="pPlay" aria-label="Play"></button>
    <button class="p-btn" id="pNext" aria-label="Next song"></button>
    <div class="p-bar"><b id="pFill"></b></div>
  </div>
  <nav id="tabs" aria-label="Sections"></nav>
</div>

<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="front" aria-hidden="true"></canvas>

<script src="js/core.js?v=67"></script>
<script src="js/icons.js?v=67"></script>
<script src="js/cloud.js?v=67"></script>
<script src="js/lock.js?v=67"></script>
<script src="js/privacy.js?v=67"></script>
<script src="js/safety.js?v=67"></script>
<script src="js/about.js?v=67"></script>
<script src="js/linkfill.js?v=67"></script>
<script>if (!App.space() && App.store.raw.get("lists")) document.write('<script src="js/seed.js"><\/script>');</script>
<script src="js/scene.js?v=67"></script>
<script src="js/music.js?v=67"></script>
<script src="js/ornament.js?v=67"></script>
<script src="js/reveal.js?v=67"></script>
<script src="js/tracker.js?v=67"></script>
<script src="js/home.js?v=67"></script>
<script src="js/lists.js?v=67"></script>
<script src="js/advent.js?v=67"></script>
<script src="js/santa.js?v=67"></script>
<script src="js/games.js?v=67"></script>
<script src="js/start.js?v=67"></script>
<script src="js/remind.js?v=67"></script>
<script src="js/tour.js?v=67"></script>
<script src="js/main.js?v=67"></script>
</body>
</html>

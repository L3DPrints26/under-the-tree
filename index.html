<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Under the Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=14">
</head>
<body>

<div id="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="photo" id="bgPhoto"></div>
  <div class="shade"></div>
</div>
<canvas id="back" aria-hidden="true"></canvas>
<div id="scrim"></div>
<div id="santa" aria-hidden="true"></div>

<div id="shell">
  <header id="top">
    <a class="wordmark" href="#/" id="wordmark"></a>
    <button id="meBtn" class="me-btn" aria-label="Switch person"></button>
  </header>
  <main id="page"></main>
  <div id="player">
    <button class="p-open" id="pOpen" aria-label="Choose a song">
      <span class="p-art" id="pArt"></span>
      <span class="p-meta"><span class="p-title" id="pTitle">Christmas music</span><span class="p-sub" id="pSub">Tap to pick a song</span></span>
    </button>
    <button class="p-btn main" id="pPlay" aria-label="Play"></button>
    <button class="p-btn" id="pNext" aria-label="Next song"></button>
    <div class="p-bar"><b id="pFill"></b></div>
  </div>
  <nav id="tabs" aria-label="Sections"></nav>
</div>

<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="front" aria-hidden="true"></canvas>

<script src="js/core.js?v=14"></script>
<script src="js/icons.js?v=14"></script>
<script src="js/cloud.js?v=14"></script>
<script>if (!App.space() && App.store.raw.get("lists")) document.write('<script src="js/seed.js"><\/script>');</script>
<script src="js/scene.js?v=14"></script>
<script src="js/music.js?v=14"></script>
<script src="js/home.js?v=14"></script>
<script src="js/lists.js?v=14"></script>
<script src="js/advent.js?v=14"></script>
<script src="js/santa.js?v=14"></script>
<script src="js/games.js?v=14"></script>
<script src="js/main.js?v=14"></script>
</body>
</html>
